{{/*
  ui/input props:
    id, name, type (default "text"), value, placeholder, autocomplete,
    required, autofocus, class
*/}}
{{ define "ui/input" }}
<input
  type="{{ or .type "text" }}"
  {{ with .id }}id="{{ . }}"{{ end }}
  {{ with .name }}name="{{ . }}"{{ end }}
  {{ with .value }}value="{{ . }}"{{ end }}
  {{ with .placeholder }}placeholder="{{ . }}"{{ end }}
  {{ with .autocomplete }}autocomplete="{{ . }}"{{ end }}
  {{ if .required }}required{{ end }}
  {{ if .autofocus }}autofocus{{ end }}
  class="{{ clsx
    "flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm shadow-xs transition-colors placeholder:text-muted-foreground outline-none focus-visible:ring-2 focus-visible:ring-ring disabled:cursor-not-allowed disabled:opacity-50"
    .class
  }}" />
{{ end }}

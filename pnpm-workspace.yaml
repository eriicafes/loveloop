# Vercel rejects functions whose included files are symlinks, and
# api/workflow-web.ts includes packages from node_modules, so install them as
# real directories.
nodeLinker: hoisted
allowBuilds:
  cbor-extract: false
minimumReleaseAgeExclude:
  - '@cbor-extract/cbor-extract-win32-x64@2.2.3'
  - '@workflow/errors@5.1.0'
  - '@workflow/web@5.0.7'
  - '@workflow/world-local@5.2.0'
  - '@workflow/world@5.1.0'
  - go-workflow@0.6.0

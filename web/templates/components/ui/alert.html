{{/*
  ui/alert props:
    title     optional heading
    children  string or template
    variant   default | success | destructive
    class
*/}}
{{ define "ui/alert" }}
<div
  role="{{ if eq .variant "destructive" }}alert{{ else }}status{{ end }}"
  class="{{ clsx
    "rounded-lg border px-4 py-3 text-sm"
    (or (not .variant) (eq .variant "default")) "bg-card"
    (eq .variant "success") "border-success/30 bg-success-soft text-success"
    (eq .variant "destructive") "border-destructive/30 bg-destructive-soft text-destructive"
    .class
  }}">
  {{ with .title }}<p class="mb-1 font-semibold">{{ . }}</p>{{ end }}
  <div>{{ render .children }}</div>
</div>
{{ end }}

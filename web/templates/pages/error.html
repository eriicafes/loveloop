<main class="mx-auto flex min-h-dvh max-w-sm flex-col items-center justify-center gap-6 px-4 py-12 text-center">
  <div class="grid size-14 place-items-center rounded-2xl bg-accent text-3xl">💔</div>
  <div class="flex flex-col gap-1">
    <p class="text-sm font-medium text-muted-foreground">{{ .Status }}</p>
    <h1 class="text-2xl font-semibold tracking-tight">{{ .StatusText }}</h1>
    <p class="wrap-break-word text-sm text-muted-foreground">{{ .Message }}</p>
  </div>
  <a href="/" class="inline-flex h-9 items-center justify-center rounded-md border bg-card px-4 text-sm font-medium text-foreground shadow-sm transition-colors hover:bg-accent hover:text-accent-foreground">Back to setup</a>
</main>
